name: AURA COFFEE - Independent Cloud Monitoring

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-coffee-cloud-monitoring
  cancel-in-progress: false

jobs:
  cloud-monitoring:
    name: Independent Cloud Check

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node.js
        run: node --version

      - name: Validate monitoring script
        run: node --check scripts/cloud-monitor.mjs
      - name: Run monitoring tests
        run: node --test tests/cloud-monitor.test.mjs
      - name: Execute independent monitoring
        env:
          CLOUD_MONITOR_SECRET: ${{ secrets.CLOUD_MONITOR_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: node scripts/cloud-monitor.mjs