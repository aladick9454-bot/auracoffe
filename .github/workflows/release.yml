
name: Production Release

on:
  push:
    tags:
      - "v1.1.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Run existing tests
        run: npm test

      - name: Test release gate
        run: npm run test:release

      - name: Test production readiness
        run: npm run test:readiness

      - name: Test monitoring
        run: npm run test:monitoring

      - name: Test recovery
        run: node --test tests/cloud-recovery.test.mjs

      - name: Test backup monitoring
        run: npm run test:backup

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate release metadata
        env:
          RELEASE_VERSION: "1.1.0"
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:gate

  publish:
    name: Publish GitHub release
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "AURA COFFEE $RELEASE_TAG" \
            --notes-file docs/RELEASE-1.1.0.md
