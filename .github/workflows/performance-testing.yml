
name: AURA COFFEE - Performance Testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      NODE_ENV: test
      CI_TEST_DATABASE_URL: ${{ secrets.CI_TEST_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.CI_TEST_DATABASE_URL }}
      MIGRATION_TARGET: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check database migrations
        run: npm run db:status

      - name: Run performance tests
        run: npm run test:performance
